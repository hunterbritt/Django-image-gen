<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vision Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cyber-header {
            background: linear-gradient(135deg, #1F2937 0%, #2D3748 100%);
            backdrop-filter: blur(12px);
        }
        
        .neon-glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #7B7BFF;
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="particle-container">
        <!-- 动态粒子效果 -->
        <div class="particle" style="left: 20%; top: 10%;"></div>
        <div class="particle" style="left: 60%; top: 30%; animation-delay: -1s;"></div>
        <div class="particle" style="left: 80%; top: 60%; animation-delay: -2s;"></div>
    </div>

    <header class="cyber-header py-12 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold text-white mb-4">AI Vision Studio</h1>
            <p class="text-sm text-gray-300">Enterprise-grade AI solutions</p>
        </div>
    </header>

    <main class="min-h-screen container mx-auto px-6 py-12">
        <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-2xl p-8 transition-all duration-300 hover:shadow-lg">
            <div class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-600 mb-2">Image Prompt</label>
                        <input type="text" id="prompt" 
                               class="w-full px-5 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                               placeholder="Describe your vision...">
                    </div>
                    
                    <div class="relative">
                        <label class="block text-sm font-medium text-gray-600 mb-2">Model Version</label>
                        <select id="model-version" 
                                class="w-full px-5 py-3 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="2.2">Model 2.2 (Fast)</option>
                            <option value="2.3">Model 2.3 (Ultra HD)</option>
                        </select>
                    </div>
                </div>

                <button id="generate-btn" 
                        class="w-full py-3 px-6 bg-blue-600 text-white rounded-lg font-semibold transition-colors duration-300 hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300">
                    Generate Masterpiece
                </button>
            </div>

            <div id="result-container" class="mt-12 hidden">
                <div class="relative h-64">
                    <img id="hd-preview" 
                         class="absolute inset-0 w-full h-full object-cover rounded-xl shadow-lg transition-transform duration-500"
                         style="transform: scale(0.95);">
                    <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 transition-opacity duration-300" 
                         id="loading-overlay">
                        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-400"></div>
                    </div>
                </div>
                
                <div class="mt-6 flex justify-between items-center">
                    <div id="status-indicator" class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center text-sm">
                        <span class="text-gray-500">ID:</span>
                    </div>
                    <a id="download-btn" 
                       href="#" 
                       class="px-6 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors duration-300 flex items-center">
                        <svg class="mr-2 h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1"></path><rect x="4" y="6" width="16" height="12" rx="2"></rect></svg>
                        Download
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Tailwind 动画初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 模型版本动态加载（示例）
            const modelSelect = document.getElementById('model-version');
            const models = [
                { value: '2.2', text: 'Model 2.2 (Fast)' },
                { value: '2.3', text: 'Model 2.3 (Ultra HD)' }
            ];
            models.forEach(model => {
                modelSelect.add(new Option(model.text, model.value));
            });
        });
    </script>
</body>
</html>
